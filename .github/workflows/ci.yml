name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install --yes z3
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Release build
        run: cargo build --workspace --release --locked

  container-compose:
    name: Container and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose syntax
        run: |
          mkdir -p secrets
          printf '%064d' 1 > secrets/lambda-safe-api-token
          docker compose config --quiet
      - name: Build compiler image
        run: docker build --pull --tag lambda-safe-compiler:ci .
      - name: Create ephemeral API secret
        run: |
          mkdir -p secrets
          openssl rand -hex 32 > secrets/lambda-safe-api-token
          chmod 600 secrets/lambda-safe-api-token
      - name: Start integrated Compose stack
        run: docker compose up --build --detach
      - name: Exercise UI-to-compiler integration
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker compose logs --no-color || true; docker compose down --volumes --remove-orphans || true; }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "UI did not become healthy within 120 seconds" >&2
            docker compose ps
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/healthz | jq -e '.service == "lambda-safe-ui"'
          curl --fail --silent --show-error http://127.0.0.1:3000/readyz | jq -e '.service == "lambda-safe-service"'
          curl --fail --silent --show-error http://127.0.0.1:3000/v1/info | jq -e 'type == "object"'

          jq -n --rawfile source examples/valid/capacity.lambda '{source:{format:"lambda",content:$source}}' > /tmp/lambda-safe-valid.json
          curl --fail --silent --show-error -H 'content-type: application/json' --data-binary @/tmp/lambda-safe-valid.json http://127.0.0.1:3000/v1/compile > /tmp/lambda-safe-valid-result.json
          jq -e '.artifacts.manifest != null and .artifacts.certificate != null' /tmp/lambda-safe-valid-result.json

          jq -n '{source:{format:"lambda",content:"this is not a valid lambda-safe contract"}}' > /tmp/lambda-safe-invalid.json
          status=$(curl --silent --show-error --output /tmp/lambda-safe-invalid-result.json --write-out '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/lambda-safe-invalid.json http://127.0.0.1:3000/v1/compile)
          test "$status" = "422"
          jq -e '(.artifacts == null) or ((.artifacts | has("manifest")) | not)' /tmp/lambda-safe-invalid-result.json

          if curl --fail --silent --max-time 2 http://127.0.0.1:8080/v1/info >/dev/null; then
            echo "Compiler API unexpectedly reachable on host port 8080" >&2
            exit 1
          fi
