name: Fuzz

on:
  schedule:
    - cron: "31 2 * * 0"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [contract_text, contract_json, artifact_verify]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: rustup override set nightly
      - name: Run bounded fuzz campaign
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            duration=30
          else
            duration=300
          fi
          rustup target add --toolchain nightly x86_64-unknown-linux-gnu
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time="$duration"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
