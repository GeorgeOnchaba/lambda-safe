[workspace]
members = [
    "crates/lambda-safe-model",
    "crates/lambda-safe-syntax",
    "crates/lambda-safe-check",
    "crates/lambda-safe-solver",
    "crates/lambda-safe-emit",
    "crates/lambda-safe-compiler",
    "crates/lambda-safe-cli",
    "crates/lambda-safe-service",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["George Ocharo Onchaba <opensource@nigenje.com>"]
license = "Apache-2.0"
repository = "https://github.com/gee-cpu/lambda-safe"
homepage = "https://nigenje.com"
keywords = ["compiler", "formal-methods", "distributed-systems", "smt", "invariants"]
categories = ["development-tools", "compilers", "command-line-utilities"]

[workspace.dependencies]
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2.1", features = ["std"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.2"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1

