apiVersion: apps/v1
kind: Deployment
metadata:
  name: lambda-safe-compiler
  labels:
    app.kubernetes.io/name: lambda-safe-compiler
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lambda-safe-compiler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lambda-safe-compiler
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compiler
          image: nigenje/lambda-safe-compiler:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: lambda-safe-compiler
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 16Mi
