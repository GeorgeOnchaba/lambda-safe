apiVersion: v1
kind: ConfigMap
metadata:
  name: lambda-safe-compiler
data:
  LAMBDA_SAFE_BIND: "0.0.0.0:8080"
  LAMBDA_SAFE_SOLVER: "z3"
  LAMBDA_SAFE_Z3_PATH: "/usr/bin/z3"
  LAMBDA_SAFE_TIMEOUT_MS: "5000"
  LAMBDA_SAFE_MAX_SOURCE_BYTES: "1048576"
  LAMBDA_SAFE_MAX_BODY_BYTES: "1200000"
  LAMBDA_SAFE_MAX_SOLVER_OBLIGATIONS: "2048"
  LAMBDA_SAFE_MAX_CONCURRENT_REQUESTS: "32"
  RUST_LOG: "info"
