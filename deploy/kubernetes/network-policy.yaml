apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lambda-safe-compiler
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lambda-safe-compiler
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress: []
