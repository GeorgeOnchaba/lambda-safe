services:
  compiler:
    build:
      context: .
    image: nigenje/lambda-safe-compiler:0.1.0
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LAMBDA_SAFE_TIMEOUT_MS: "5000"
      LAMBDA_SAFE_MAX_SOURCE_BYTES: "1048576"
      LAMBDA_SAFE_MAX_BODY_BYTES: "1200000"
      LAMBDA_SAFE_MAX_SOLVER_OBLIGATIONS: "2048"
      LAMBDA_SAFE_MAX_CONCURRENT_REQUESTS: "32"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "/usr/local/bin/lambda-safe", "--solver", "finite", "info"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
